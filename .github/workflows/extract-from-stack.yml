name: extract EPAC from pinned stack

on:
  push:
    branches:
      - populate/stack-extraction

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      STACK_SHA: ef51f2e8f32ccfd5394525dad72475a61a505bc1
      SKILL_LIB_SHA: 8dfb974ea0cee72e4412f9d2c8b597a8930a4d57
      UCNS_SHA: 828c0b8bbcfc267efb5701da714191c1f73a81ff
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch exact extraction inputs
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/The-Interdependency/stack.git /tmp/stack
          git -C /tmp/stack checkout --quiet "$STACK_SHA"
          git clone --quiet https://github.com/The-Interdependency/skill-lib.git /tmp/skill-lib
          git -C /tmp/skill-lib checkout --quiet "$SKILL_LIB_SHA"
          git clone --quiet https://github.com/The-Interdependency/ucns.git /tmp/ucns
          git -C /tmp/ucns checkout --quiet "$UCNS_SHA"
          test "$(git -C /tmp/stack rev-parse HEAD)" = "$STACK_SHA"
          test "$(git -C /tmp/skill-lib rev-parse HEAD)" = "$SKILL_LIB_SHA"
          test "$(git -C /tmp/ucns rev-parse HEAD)" = "$UCNS_SHA"

      - name: Extract implementation and install canonical skills
        run: |
          set -euo pipefail
          cp README.md /tmp/EPAC_README.md
          rsync -a /tmp/stack/research/epac/ ./
          cp /tmp/EPAC_README.md README.md

          rm -rf .agents/skills
          mkdir -p .agents/skills
          for skill_file in /tmp/skill-lib/*/SKILL.md; do
            cp -a "$(dirname "$skill_file")" .agents/skills/
          done
          cat > .agents/skills/README.md <<EOF
          # Canonical skill-lib snapshot

          Source: The-Interdependency/skill-lib
          Commit: $SKILL_LIB_SHA

          These directories are repo-local consumers. Canonical doctrine remains in skill-lib.
          EOF

      - name: Remove forge-only test paths and mark historical records
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for root in (Path("tests"), Path("subatomic")):
              for path in root.glob("test_*.py"):
                  lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
                  path.write_text("".join(line for line in lines if "STACK_ROOT" not in line), encoding="utf-8")

          banners = {
              Path("docs/preregistration-molecular-geometry-from-element-gonols.md"):
                  "> Migration note: this preregistration was frozen in the stack incubator before EPAC extraction. Its original authority/context statements are retained as historical evidence.\n\n",
              Path("subatomic/subatomic-affixiation-baseline.md"):
                  "> Migration note: this document records the stack-incubation phase. Statements that no EPAC repository existed were true of that phase and are not current repository status.\n\n",
          }
          for path, banner in banners.items():
              text = path.read_text(encoding="utf-8")
              if not text.startswith("> Migration note:"):
                  path.write_text(banner + text, encoding="utf-8")
          PY

      - name: Verify repository regression suite
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD:/tmp/ucns/src" python -m unittest discover -s tests -q

      - name: Verify subatomic executable witnesses
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD:$PWD/subatomic:/tmp/ucns/src" python - <<'PY'
          from pathlib import Path
          import importlib.util
          import inspect

          total = 0
          for path in sorted(Path("subatomic").glob("test_*.py")):
              spec = importlib.util.spec_from_file_location(f"epac_subatomic_{path.stem}", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot load {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name, fn in sorted(vars(module).items()):
                  if not name.startswith("test_") or not callable(fn):
                      continue
                  if inspect.signature(fn).parameters:
                      raise RuntimeError(f"unsupported fixture-bearing witness: {path}:{name}")
                  fn()
                  total += 1
          if total == 0:
              raise RuntimeError("no subatomic witnesses executed")
          print(f"{total} subatomic witnesses passed")
          PY

      - name: Verify falsification and work-graph invariants
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD:/tmp/ucns/src" python - <<'PY'
          from epac_comparison import compare_after_construction
          standings = compare_after_construction()["standings"]
          if set(standings.values()) != {"FALSIFIED"}:
              raise SystemExit(f"falsification standing drifted: {standings}")
          print(standings)
          PY
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          doc = json.loads(Path("docs/work-graph.json").read_text(encoding="utf-8"))
          payload = {"repositories": doc["repositories"], "boundaries": doc["boundaries"]}
          actual = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          ).hexdigest()
          if actual != doc["work_graph_sha256"]:
              raise SystemExit(f"work graph mismatch: {actual} != {doc['work_graph_sha256']}")
          print(actual)
          PY

      - name: Seal verified extraction
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/graduation.json")
          record = json.loads(path.read_text(encoding="utf-8"))
          record["physical_repository_state"] = "extracted"
          record["gates"]["independent_tests"] = "pass"
          path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY

          rm .github/workflows/extract-from-stack.yml
          git config user.name "epac-populate-agent"
          git config user.email "epac-populate-agent@interdependentway.org"
          git add -A
          git commit -m "feat: populate EPAC from pinned stack research"
          git push origin HEAD:populate/stack-extraction
