[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interdependency-epac"
version = "0.1.0"
description = "EPAC construction and replay research with preserved falsification standing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "The Interdependency"}]
license = "MPL-2.0"
license-files = ["LICENSE"]
# The exact UCNS source artifact is bound before release qualification.
dependencies = ["ucns @ https://github.com/The-Interdependency/ucns/archive/6eea1828a34ed8ec99879f8090ea5d48352d8c2d.tar.gz#sha256=1665ae06921a0a425ef1c99ce9d811cf8b52c20e4873edea53c4cdecaf2895d9"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
build = ["build==1.5.0", "twine==7.0.0", "setuptools==84.0.0", "wheel==0.48.0"]

[tool.setuptools]
py-modules = ["epac_evidence_cache", "epac_atomic", "epac_comparison", "epac_dimensional_arity", "epac_molecular", "epac_periodic", "epac_public_gonol", "epac_ucns_provenance", "epac_boundary_minimal_refinement", "epac_boundary_nondegeneracy", "epac_boundary_probe_completeness", "epac_boundary_quotient", "epac_cross_scale_closure"]
packages = ["epac_data", "epac_subatomic", "epac_viz"]
package-dir = {epac_data = "data", epac_subatomic = "subatomic", epac_viz = "viz"}

[tool.setuptools.package-data]
epac_data = ["*.json"]
epac_subatomic = ["receipts/*.json", "receipts/*/*.json"]
epac_viz = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
